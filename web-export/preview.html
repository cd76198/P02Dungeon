<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UE 맵 내보내기 검사</title>
<style>body{margin:0;background:#18202a;color:#e7edf4;font:14px system-ui}canvas{display:block}aside{position:absolute;top:16px;left:16px;width:300px;padding:18px;background:#121a24ee;border:1px solid #425063;border-radius:12px}h1{font-size:18px;margin:0 0 12px}select,button{background:#29384a;color:white;border:1px solid #68778a;border-radius:5px;padding:8px;margin:3px}label{display:block;margin:9px 0}small{color:#b8c5d5}pre{white-space:pre-wrap;font:12px monospace;max-height:200px;overflow:auto}#status{color:#84d3b1}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<aside><h1>필드·던전 내보내기 검사</h1><select id="map" aria-label="맵"><option value="field">최신 필드 v09-17_A</option><option value="dungeon">최신 던전 보수 v02</option></select><br><button id="overview">전체 보기</button><button id="start">시작 쿼터뷰</button><button id="bridge">다리</button><button id="lever">레버</button><button id="exit">최종 장치</button><label><input type="checkbox" id="collision">충돌만 보기</label><label><input type="checkbox" id="hidden">초기에 숨긴 메시도 표시</label><p id="status">불러오는 중…</p><small>드래그: 회전 · 휠: 확대 · 우클릭 드래그: 이동<br>메시 클릭: 원본 오브젝트 이름<br>검사 뷰어이며 전체 게임 플레이는 구현하지 않았습니다.</small><pre id="details"></pre></aside>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x18202a);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.05,3000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xe2efff,0x53515c,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-60,120,30);scene.add(sun);
const loader=new GLTFLoader(),maps={},$=id=>document.getElementById(id),status=$('status');let current='field',loading=0;
const facts=await fetch('./coordinates-camera.json').then(r=>r.json());
function visible(){let obj=maps[current];if(!obj)return;obj.visual.visible=!$('collision').checked;obj.collision.visible=$('collision').checked;obj.visual.traverse(o=>{if(o.userData.initially_hidden)o.visible=$('hidden').checked;});}
function overview(){const box=new THREE.Box3().setFromObject(maps[current].visual),c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3()).length();camera.fov=45;camera.position.copy(c).add(new THREE.Vector3(-s*.55,s*.68,s*.5));controls.target.copy(c);camera.updateProjectionMatrix();controls.update();}
function quarter(target){const f=facts.maps[current].active_camera;const t=new THREE.Vector3(...target);camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(THREE.MathUtils.degToRad(45)/2)/camera.aspect));camera.position.copy(t).add(new THREE.Vector3(...f.follow_offset_gltf_m));controls.target.copy(t);camera.updateProjectionMatrix();controls.update();}
async function load(){const token=++loading;current=$('map').value;status.textContent='불러오는 중…';for(const m of Object.values(maps)){m.visual.visible=false;m.collision.visible=false;}
try{if(!maps[current]){const [v,c]=await Promise.all([loader.loadAsync(`./${current}.glb`),loader.loadAsync(`./${current}-collision.glb`)]);maps[current]={visual:v.scene,collision:c.scene};scene.add(v.scene,c.scene);}if(token!==loading)return;visible();overview();status.textContent=`${current}: 모델·충돌 로드 완료`;$('details').textContent='모델 원점과 크기를 변경하지 않았습니다.';}catch(e){status.textContent='로드 실패: '+e.message;console.error(e);}}
$('map').onchange=load;$('overview').onclick=overview;$('start').onclick=()=>quarter(facts.maps[current].pawn_settled_snapshot.gltf_m);$('collision').onchange=visible;$('hidden').onchange=visible;
$('bridge').onclick=()=>{if(current==='dungeon')quarter([52.5,3.4,11]);};$('lever').onclick=()=>{if(current==='dungeon')quarter([91.5,3.8,11]);};$('exit').onclick=()=>{if(current==='dungeon')quarter([53.75,-8.6,1.5]);};
const ray=new THREE.Raycaster();renderer.domElement.addEventListener('click',e=>{ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),camera);const active=maps[current]?.[$('collision').checked?'collision':'visual'];if(!active)return;const hit=ray.intersectObject(active,true).find(h=>{let o=h.object;while(o){if(!o.visible)return false;o=o.parent;}return true;});if(hit){let o=hit.object;while(o&&!o.userData.ue_actor_name)o=o.parent;$('details').textContent=JSON.stringify({name:o?.userData.ue_actor_name,label:o?.userData.ue_actor_label,component:hit.object.userData.ue_component_name,point_m:hit.point.toArray().map(v=>+v.toFixed(3))},null,2);}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});await load();
</script></html>
